<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North America Data Centers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <h1>NA Data Centers</h1>
        <span class="subtitle">Real-time infrastructure map</span>
      </div>
      <div class="header-stats">
        <div class="stat">
          <span class="stat-value" id="total-count">0</span>
          <span class="stat-label">Total Sites</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="us-count">0</span>
          <span class="stat-label">United States</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="ca-count">0</span>
          <span class="stat-label">Canada</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="mx-count">0</span>
          <span class="stat-label">Mexico</span>
        </div>
      </div>
    </header>

    <div class="main-content">
      <aside id="sidebar">
        <div class="sidebar-header">
          <h2>Filters</h2>
        </div>
        <div class="filter-group">
          <label>Provider</label>
          <div id="provider-filters" class="filter-chips"></div>
        </div>
        <div class="filter-group">
          <label>Tier</label>
          <div id="tier-filters" class="filter-chips"></div>
        </div>
        <div class="filter-group">
          <label>Country</label>
          <div id="country-filters" class="filter-chips"></div>
        </div>
        <div class="sidebar-header" style="margin-top: 24px;">
          <h2>Legend</h2>
        </div>
        <div class="legend">
          <div class="legend-item">
            <span class="legend-dot" style="background: #00e5ff;"></span>
            <span>Hyperscale</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background: #76ff03;"></span>
            <span>Colocation</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background: #ff9100;"></span>
            <span>Enterprise</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background: #ea80fc;"></span>
            <span>Edge / CDN</span>
          </div>
        </div>
        <div id="detail-panel" class="detail-panel hidden">
          <div class="detail-header">
            <h3 id="detail-name"></h3>
            <button id="detail-close">&times;</button>
          </div>
          <div class="detail-body">
            <div class="detail-row"><span class="detail-key">Provider</span><span id="detail-provider" class="detail-val"></span></div>
            <div class="detail-row"><span class="detail-key">Location</span><span id="detail-location" class="detail-val"></span></div>
            <div class="detail-row"><span class="detail-key">Type</span><span id="detail-type" class="detail-val"></span></div>
            <div class="detail-row"><span class="detail-key">Tier</span><span id="detail-tier" class="detail-val"></span></div>
            <div class="detail-row"><span class="detail-key">Capacity</span><span id="detail-capacity" class="detail-val"></span></div>
            <div class="detail-row"><span class="detail-key">Year Opened</span><span id="detail-year" class="detail-val"></span></div>
          </div>
        </div>
      </aside>

      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
